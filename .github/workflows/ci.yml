name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.1", "3.2", "3.3", "3.4" ]
        rails: [ "7.2", "8.0", "8.1" ]
        exclude:
          - { ruby: "3.1", rails: "8.0" }
          - { ruby: "3.1", rails: "8.1" }
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
